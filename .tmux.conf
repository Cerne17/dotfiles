# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Responsiveness ----
set -sg escape-time 10
set -g mouse on

# Forward terminal focus in and out of panes. Without this Neovim never sees
# FocusGained/FocusLost inside tmux, so 'autoread' never fires and a file
# changed by another tool goes unnoticed until the buffer is touched.
set -g focus-events on

# 2000 lines of scrollback is roughly one verbose build.
set -g history-limit 50000

# vi keys in copy mode, to match the editor this sits under.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
set -g set-clipboard on

# New splits and windows inherit the current pane's directory; the defaults
# drop you back in $HOME, which is never what you want mid-task.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation and resizing (-r repeats without the prefix).
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message "cerne: config reloaded"

# lazygit in a popup rather than a pane, so it never disturbs the layout.
# Mirrors <leader>gg in Neovim.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ---- Truecolor (exact RGB for the hex palette below) ----
set -ga terminal-overrides ",*:Tc"

# ---- Appearance: cerne.pro palette (heartwood core) ----
# --ink #0C0D10  --surface #14161B  --surface-2 #1F2229
# --text #E8E4DB  --text-muted #9A968C
# --heartwood #E89A3C (accent)  --oxblood #8C3B24 (depth / active)

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#14161B,fg=#9A968C"

# Session name, amber pill on the left
set -g status-left-length 30
set -g status-left "#[bg=#E89A3C,fg=#0C0D10,bold] #S #[bg=#14161B,fg=#E89A3C,nobold]"

# Date, time, hostname on the right
set -g status-right-length 60
set -g status-right "#[fg=#827F76]%Y-%m-%d #[fg=#9A968C]%H:%M #[bg=#1F2229,fg=#E89A3C,bold] #h "

# Window list — muted when inactive, oxblood pill when current
setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=#9A968C"
setw -g window-status-current-format "#[bg=#8C3B24,fg=#E8E4DB,bold] #I:#W #[bg=#14161B,fg=#8C3B24,nobold]"
setw -g window-status-activity-style "fg=#E89A3C"
setw -g window-status-separator ""

# Pane borders — amber marks the active pane
set -g pane-border-style "fg=#1F2229"
set -g pane-active-border-style "fg=#E89A3C"

# Command line / messages
set -g message-style "bg=#8C3B24,fg=#E8E4DB"
set -g message-command-style "bg=#8C3B24,fg=#E8E4DB"

# Clock mode (prefix + t)
setw -g clock-mode-colour "#E89A3C"
setw -g clock-mode-style 24

# Toggle to the light theme: prefix + T (this server session only --
# `cerne-theme light|dark` in zsh is the sticky-across-restarts version,
# and re-syncs a live tmux session too).
#
# @cerne_explicit marks "the user picked a polarity by hand". Without it the
# toggle could not reach dark while macOS was in light mode: prefix+T from the
# light config sources this file, whose appearance probe below would detect
# light and immediately source the light config straight back.
bind T set -g @cerne_explicit 1 \; source-file ~/.tmux-light.conf \; display-message "cerne: light theme"

# Follow the macOS system appearance at server start, unless an explicit pick
# is already in force. `cerne-theme auto` in zsh clears the flag.
if-shell '[ -z "#{@cerne_explicit}" ] && [ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" != "Dark" ]' \
  'source-file ~/.tmux-light.conf'
