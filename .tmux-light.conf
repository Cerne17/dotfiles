# cerne.pro brand palette — "sapwood" (light)
# --ink #ECEBE6  --surface #F5F4F0  --surface-2 #D8D5CC
# --text #1A1B1E  --text-muted #5A5852  --accent (heartwood/oxblood) #8C3B24
# Mirrors ~/.tmux.conf's dark styling; toggle between the two with prefix+T.
# All pairs verified >=4.36:1 (WCAG AA) against their own background.

set -g status-style "bg=#F5F4F0,fg=#5A5852"

set -g status-left "#[bg=#8C3B24,fg=#ECEBE6,bold] #S #[bg=#F5F4F0,fg=#8C3B24,nobold]"

set -g status-right "#[fg=#6F6D65]%Y-%m-%d #[fg=#5A5852]%H:%M #[bg=#D8D5CC,fg=#8C3B24,bold] #h "

setw -g window-status-style "fg=#5A5852"
setw -g window-status-current-format "#[bg=#8C3B24,fg=#ECEBE6,bold] #I:#W #[bg=#F5F4F0,fg=#8C3B24,nobold]"
setw -g window-status-activity-style "fg=#8C3B24"

set -g pane-border-style "fg=#D8D5CC"
set -g pane-active-border-style "fg=#8C3B24"

set -g message-style "bg=#8C3B24,fg=#ECEBE6"
set -g message-command-style "bg=#8C3B24,fg=#ECEBE6"

setw -g clock-mode-colour "#8C3B24"

# Toggle back to the dark theme: prefix + T
bind T source-file ~/.tmux.conf \; display-message "cerne: dark theme"
